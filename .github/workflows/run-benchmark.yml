name: Run benchmark case

on:
  push:
    branches: [main]
    paths:
      - 'cases/**'
      - 'patches/**'
      - '.github/workflows/run-benchmark.yml'
  workflow_dispatch:
    inputs:
      case_id:
        description: Benchmark case id, e.g. immich-26979
        required: true
        default: immich-26979
      candidate_ref:
        description: Optional harness branch/ref containing patches/<case_id>.diff
        required: false
        default: main

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CASE_ID: ${{ inputs.case_id || 'immich-26979' }}
      CANDIDATE_REF: ${{ inputs.candidate_ref || 'main' }}
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REF }}

      - name: Load case metadata
        id: case
        shell: bash
        run: |
          set -euo pipefail
          CASE_FILE="cases/${CASE_ID}.json"
          test -f "$CASE_FILE"
          echo "repo=$(jq -r .upstream_repo "$CASE_FILE")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .base_sha "$CASE_FILE")" >> "$GITHUB_OUTPUT"
          echo "runtime=$(jq -r .runtime.kind "$CASE_FILE")" >> "$GITHUB_OUTPUT"
          echo "runtime_version=$(jq -r .runtime.version "$CASE_FILE")" >> "$GITHUB_OUTPUT"
          echo "workdir=$(jq -r .runtime.working_directory "$CASE_FILE")" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned upstream repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.case.outputs.repo }}
          ref: ${{ steps.case.outputs.sha }}
          path: upstream
          persist-credentials: false

      - name: Apply candidate patch if present
        shell: bash
        run: |
          set -euo pipefail
          PATCH="patches/${CASE_ID}.diff"
          if [ -f "$PATCH" ] && [ -s "$PATCH" ]; then
            git -C upstream apply --check "../$PATCH"
            git -C upstream apply "../$PATCH"
          else
            echo "No candidate patch present; validating pinned buggy baseline."
          fi

      - name: Set up Flutter
        if: steps.case.outputs.runtime == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.case.outputs.runtime_version }}
          channel: stable
          cache: true

      - name: Install dependencies
        shell: bash
        working-directory: upstream/${{ steps.case.outputs.workdir }}
        run: |
          set -euo pipefail
          CASE_FILE="${GITHUB_WORKSPACE}/cases/${CASE_ID}.json"
          jq -r '.validation.setup[]?' "$CASE_FILE" | while IFS= read -r cmd; do
            echo "+ $cmd"
            bash -lc "$cmd"
          done

      - name: Run validation
        shell: bash
        working-directory: upstream/${{ steps.case.outputs.workdir }}
        run: |
          set -euo pipefail
          CASE_FILE="${GITHUB_WORKSPACE}/cases/${CASE_ID}.json"
          jq -r '.validation.commands[]?' "$CASE_FILE" | while IFS= read -r cmd; do
            echo "+ $cmd"
            bash -lc "$cmd"
          done

      - name: Capture candidate diff
        if: always()
        shell: bash
        run: |
          git -C upstream diff --stat || true
          git -C upstream diff || true
